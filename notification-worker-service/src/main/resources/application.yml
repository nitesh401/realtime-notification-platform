server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: notification-worker-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${WORKER_DB_USER:worker_svc}
    password: ${WORKER_DB_PASSWORD}
    hikari:
      schema: worker
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: worker
    default-schema: worker
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 6000
    consumer:
      group-id: notification-worker
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: 3

worker:
  retry:
    attempts: 4          # total attempts for one event: 1 initial + 3 retries, then the dead-letter topic
    delay-ms: 2000
    multiplier: 2.0
    max-delay-ms: 30000
  admin-key: ${WORKER_ADMIN_KEY:}
  email:
    from: ${MAIL_FROM:notifications@example.test}
    simulate-failure-suffix: ${EMAIL_SIMULATE_FAILURE_SUFFIX:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false     # MailHog being down must not make the worker "not ready"; it just retries
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
