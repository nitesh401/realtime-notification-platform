# Infrastructure (postgres, kafka, mailhog) + the two services.
#   Infra only:  docker compose up -d postgres kafka mailhog
#   Everything:  docker compose up -d --build
name: notification-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set in .env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-notifications}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  notification-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: notification-api-service
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-notifications}
      API_DB_USER: api_svc
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    stop_grace_period: 40s

  notification-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: notification-worker-service
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mailhog: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-notifications}
      WORKER_DB_USER: worker_svc
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      WORKER_ADMIN_KEY: ${WORKER_ADMIN_KEY:-}
      EMAIL_SIMULATE_FAILURE_SUFFIX: ${EMAIL_SIMULATE_FAILURE_SUFFIX:-}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "8081:8081"
    stop_grace_period: 40s

volumes:
  pgdata:
  kafkadata:
